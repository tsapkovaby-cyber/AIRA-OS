[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aira-live-classroom"
version = "0.24.0"
description = "Transport-independent live language classroom for AIRA OS"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["backend/education/live_classroom/tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["backend*"]
