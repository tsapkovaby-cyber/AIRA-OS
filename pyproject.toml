[project]
name = "aira-os"
version = "0.5.0"
description = "AIRA OS integrated architecture components"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests", "backend", "src"]

[tool.ruff]
line-length = 100
