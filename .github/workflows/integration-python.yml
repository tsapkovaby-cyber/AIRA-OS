name: Integration Python Regression

on:
  push:
    branches:
      - integration/sprints-001-024
  pull_request:
    branches:
      - main

jobs:
  python-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e '.[dev]'

      - name: Compile all Python modules
        run: python -m compileall -q backend src aira_memory tests

      - name: Run consolidated test suite
        env:
          PYTHONPATH: .:src
        run: python -m pytest -q
